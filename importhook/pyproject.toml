[project]
name = "future-async-yield-from"
version = "2025.11.24.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rbroderi", email = "richard.broderick@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
  "beartype>=0.22.6",
  "tokenize-rt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "asttab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"future_async_yield_from.pth" = "future_async_yield_from.pth"

[tool.uv.sources]
asttab = { git = "https://github.com/rbroderi/asttab" }
